<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Starter: one filled bar. The three plan marks are the same glyph family —
       stacked bars that grow with the tier — so the progression reads instantly. -->
  <rect x="6" y="19" width="6" height="7" rx="1.6" fill="#1C1A16"/>
  <rect x="13" y="19" width="6" height="7" rx="1.6" fill="#1C1A16" opacity="0.18"/>
  <rect x="20" y="19" width="6" height="7" rx="1.6" fill="#1C1A16" opacity="0.18"/>
</svg>
